artifact_root: output

data_ingestion:
  root_dir: output/data_ingestion
  data_path: "https://drive.google.com/uc?export=download&id=1OPoYRR_GjdedXQrBiRzV0wPQaNCPmm0I"
  zip_file: output/data_ingestion/data.zip
  unzip_file: output/data_ingestion

data_validation:
  root_dir: output/data_validation
  data_path: output/data_ingestion/combined_data.csv
  status_file: output/data_validation/status.txt

data_transformation:
  root_dir: output/data_transformation
  data_path: output/data_ingestion/combined_data.csv

model_building:
  root_dir: output/build_model
  xtrain_data: output/data_transformation/x_train.pkl
  ytrain_data: output/data_transformation/y_train.pkl
  model: model.pkl

model_evaluation:
  root_dir: output/model_evaluation
  xval_data: output/data_transformation/x_val.pkl
  yval_data: output/data_transformation/y_val.pkl
  model: output/build_model/model.pkl
  metric_file: output/model_evaluation/mertic.json